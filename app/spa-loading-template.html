<!--
  First paint of the SPA (ssr: false): shown until the Nuxt app mounts.
  Same language as the in-app loader (components/app/Loading.vue) and the home hero: an ASCII orbit —
  four sparks circle an ellipse on an empty field, each trailing the density ramp "@ % # * + = - : ."
  and cooling like the hero's brush.
  Nothing from the app is available yet (no CSS vars, no Vue), so colours are literal and the
  theme follows the same rule as the app: the stored choice (localStorage q-dark-mode), otherwise the OS.
-->
<script>
  // runs before the boot markup is parsed: the very first paint is already in the right theme.
  // Same rule as the app (plugins/theme.client.ts): the stored choice wins, otherwise follow the OS.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("q-dark-mode"); } catch (e) {}
    var osDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (stored === "true" || (stored === null && osDark)) document.documentElement.classList.add("fl-boot-dark");
  })();
</script>
<div id="fl-boot" class="fl-boot" role="status" aria-live="polite">
  <div class="fl-boot__mark" aria-hidden="true">
    <pre id="fl-boot-base" class="fl-boot__ascii fl-boot__ascii--base">                               
                               
                               
                               
                               
                               
                               
                               
                               </pre>
    <pre id="fl-boot-ink" class="fl-boot__ascii fl-boot__ascii--ink"></pre>
  </div>
  <span class="fl-boot__label">загрузка</span>
</div>
<style>
  .fl-boot {
    --bg: #f1f2f5;
    --fg: #131313;
    --muted: #666666;
    --ink: #2f41e3;

    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;

    background-color: var(--bg);
    user-select: none;
    -webkit-user-select: none;
  }

  .fl-boot-dark .fl-boot {
    --bg: #131313;
    --fg: #f1f2f5;
    --muted: #a0a0a0;
    --ink: #4277f3;
  }

  .fl-boot__mark {
    display: grid;
  }

  .fl-boot__ascii {
    grid-area: 1 / 1;
    margin: 0;
    padding: 0;
    background: transparent;

    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.2;
    white-space: pre;
  }

  /* the base layer is blank: it only holds the grid's size */
  .fl-boot__ascii--ink {
    color: var(--ink);
    text-shadow: 0 0 10px color-mix(in srgb, var(--ink) 60%, transparent);
  }

  .fl-boot__label {
    font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    color: var(--muted);
  }
</style>
<script>
  (function () {
    var root = document.getElementById("fl-boot");
    if (!root) return;

    // Warm the fonts while the boot screen is up: a face is only downloaded once text needs it,
    // so without this Inter / Space Grotesk / JetBrains Mono arrive after the app mounts and the
    // text visibly swaps. Latin + Cyrillic samples pull both subsets of the variable faces.
    try {
      if (document.fonts && document.fonts.load) {
        [
          '400 1em "Inter"',
          '700 1em "Inter"',
          '500 1em "Space Grotesk"',
          '700 1em "Space Grotesk"',
          '400 1em "JetBrains Mono"',
          '500 1em "JetBrains Mono"',
        ].forEach(function (f) {
          document.fonts.load(f, "Aa Яя 01").catch(function () {});
        });
      }
    } catch (e) {}

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var baseEl = document.getElementById("fl-boot-base");
    var inkEl = document.getElementById("fl-boot-ink");
    var blank = baseEl.textContent.split("\n");
    var COLS = 31;
    var ROWS = 9;
    var ramp = ".:-=+*#%@";
    var heat = new Float32Array(COLS * ROWS);
    var cx = (COLS - 1) / 2;
    var cy = (ROWS - 1) / 2;
    var rx = COLS / 2 - 2.5;
    var ry = ROWS / 2 - 1;
    var sparks = [0, 1, 2, 3].map(function (i) {
      return { phase: (i * Math.PI) / 2, speed: 2.1 + i * 0.23, wobble: 0.5 + i * 0.7 };
    });
    var t0 = performance.now();
    var prev = t0;

    function frame(now) {
      // the template is removed when Nuxt mounts: stop with it
      if (!root.isConnected) return;
      var dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      var t = (now - t0) / 1000;

      // cool the trails (frame-rate independent)
      var cool = Math.pow(0.84, dt * 60);
      for (var i = 0; i < heat.length; i++) heat[i] *= cool;

      // each spark heats the cells around it; cells are ~2x taller than wide, so y distance counts double
      for (var s = 0; s < sparks.length; s++) {
        var sp = sparks[s];
        var a = sp.phase + t * sp.speed;
        var k = 1 + 0.12 * Math.sin(a * 3 + t * sp.wobble);
        var x = cx + Math.cos(a) * rx * k;
        var y = cy + Math.sin(a) * ry * k;
        for (var r = Math.floor(y - 1); r <= Math.ceil(y + 1); r++) {
          if (r < 0 || r >= ROWS) continue;
          for (var c = Math.floor(x - 2); c <= Math.ceil(x + 2); c++) {
            if (c < 0 || c >= COLS) continue;
            var d = Math.hypot(c - x, (r - y) * 2);
            if (d < 1.6) heat[r * COLS + c] = Math.min(1, heat[r * COLS + c] + (1 - d / 1.6) * 0.55);
          }
        }
      }

      var base = [];
      var ink = [];
      for (var row = 0; row < ROWS; row++) {
        var b = "";
        var kk = "";
        for (var col = 0; col < COLS; col++) {
          var v = heat[row * COLS + col];
          if (v > 0.06) {
            b += " ";
            kk += ramp.charAt(Math.min(ramp.length - 1, Math.floor(v * ramp.length)));
          } else {
            b += blank[row].charAt(col) || " ";
            kk += " ";
          }
        }
        base.push(b);
        ink.push(kk);
      }
      baseEl.textContent = base.join("\n");
      inkEl.textContent = ink.join("\n");
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
</script>
